name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:alchemy-closure
      - run: npm run test:worldbook-v2
      - run: npm run test:strategy-sim-v2
      - run: npm run test:worldbook-v2-product
      - run: npm run test:strategy-sim-v2-product
      - run: npm run test:v2-product-playable
      - run: npm run test:llm-prompts
      - run: npm run audit:architecture-debt
      - run: npm run audit:v2-product-playable
      - run: npm run test:world-tree-v2-entries
      - run: npm run test:project-complete-audit
      - run: npm run truth:check
      - run: npm run audit
      - run: npm run interface-audit

  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:product-entry-browser-matrix
      - run: npm run smoke:experience-golden-path
      - run: npm run smoke:v0.5-interaction-regressions
      - run: npm run qa:visual-shell
      - run: npm run test:accessibility

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run verify:coverage

  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:reliability
      - run: npm run soak:persistence-local

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - shell: pwsh
        run: ./scripts/windows-launcher-smoke.ps1

  exact-sha-evidence:
    name: exact-sha-evidence
    if: ${{ success() }}
    needs: [check, browser-quality, coverage, reliability, windows-launcher]
    runs-on: ubuntu-latest
    steps:
      - name: Write exact-SHA verification evidence
        shell: bash
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BROWSER_RESULT: ${{ needs.browser-quality.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RELIABILITY_RESULT: ${{ needs.reliability.result }}
          WINDOWS_RESULT: ${{ needs.windows-launcher.result }}
        run: |
          node -e 'const fs=require("fs"); const e={schemaVersion:1,sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,workflow:process.env.GITHUB_WORKFLOW,event:process.env.GITHUB_EVENT_NAME,node:process.version,os:process.platform,arch:process.arch,commands:["npm run check","npm test","npm run test:unit","npm run test:integration","npm run verify:coverage","npm run test:reliability","npm run soak:persistence-local","npm run smoke:product-entry-browser-matrix","npm run smoke:experience-golden-path","npm run smoke:v0.5-interaction-regressions","npm run qa:visual-shell","npm run test:accessibility","./scripts/windows-launcher-smoke.ps1"],jobs:{check:process.env.CHECK_RESULT,browserQuality:process.env.BROWSER_RESULT,coverage:process.env.COVERAGE_RESULT,reliability:process.env.RELIABILITY_RESULT,windowsLauncher:process.env.WINDOWS_RESULT},result:"PASS_REMOTE_EXACT_SHA",generatedAt:new Date().toISOString()}; fs.writeFileSync("ci-evidence.json",JSON.stringify(e,null,2)+"\n");'
          cat ci-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: world-tree-ci-evidence-${{ github.sha }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 30
